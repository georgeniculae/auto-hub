server:
  port: 0
  # No servlet.context-path on purpose, unlike the other services: the stateless MCP transport
  # already binds /mcp, and the gateway routes Path=/mcp/** without StripPrefix. Adding one
  # would produce /mcp/mcp and break the route.

spring:
  application:
    name: auto-hub-mcp
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: auto-hub-mcp
        version: 0.0.1
        protocol: stateless
        type: sync
        instructions: "Provides read-only access to the Auto Hub car rental inventory."
  cloud:
    loadbalancer:
      enabled: true
      cache:
        enabled: true
  web:
    error:
      include-message: always
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

eureka:
  client:
    enabled: true
    healthcheck:
      enabled: true
    eureka-server-port: 8761
    service-url:
      defaultZone: http://localhost:8761/eureka/
    proxy-password: ${EUREKA_USER}
    proxy-user-name: ${EUREKA_PASSWORD}
  instance:
    prefer-ip-address: true

management:
  server:
    port: ${server.port}
  endpoint:
    health:
      group:
        custom:
          show-components: always
          show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,loggers,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org:
      springframework:
        security: ERROR

rest-client:
  url:
    auto-hub-agency-cars: http://auto-hub-agency/agency/cars
